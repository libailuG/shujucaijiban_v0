source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32h7x.cfg]
adapter speed 500
gdb port disabled
tcl port disabled
telnet port disabled
init
targets stm32h7x.cpu0
set uid [read_memory 0x1ff1e800 32 3]
if {[lindex [read_memory 0xe000ed00 32 1] 0] != 0x411fc272 || [lindex $uid 0] != 0x002b0018 || [lindex $uid 1] != 0x3035510e || [lindex $uid 2] != 0x34353932} {error "Wrong mainboard"}
reset halt
if {[catch {
 flash write_image erase firmware/Objects/zhuban_caiji.hex
 verify_image firmware/Objects/zhuban_caiji.hex
} message]} {
 echo "FLASH_FAILED $message"
 reset run
 shutdown error
} else {
 echo "FLASH_VERIFIED"
 reset run
 sleep 3000
 poll
 echo "STATE [stm32h7x.cpu0 curstate]"
 echo "LEFT [read_memory 0x20000ed4 32 19]"
 echo "RIGHT [read_memory 0x20000f20 32 19]"
 shutdown
}
