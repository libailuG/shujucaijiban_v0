# Keil external flash tool: resolve firmware relative to this file.
set firmware [file normalize [file join [file dirname [info script]] .. Objects zhuban_led.hex]]
source [find interface/stlink.cfg]
transport select swd
source [find target/stm32h7x.cfg]
adapter speed 100
gdb port disabled
tcl port disabled
telnet port disabled
init
# AP2 remains accessible even when CPU-side debug cannot be examined.
stm32h7x.ap2 write_memory 0xE00E1004 32 {0x0070013F}
stm32h7x.cpu0 arp_examine
program $firmware verify reset exit
