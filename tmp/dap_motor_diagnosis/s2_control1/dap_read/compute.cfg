source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32h7x.cfg]
adapter speed 500
gdb_port disabled
tcl_port disabled
telnet_port disabled
init
targets stm32h7x.cpu0
set cpuid [lindex [read_memory 0xe000ed00 32 1] 0]
set chipid [lindex [read_memory 0x5c001000 32 1] 0]
echo [format "GUARD CPUID=0x%08x CHIPID=0x%08x" $cpuid $chipid]
if {$cpuid != 0x411fc272 || ($chipid & 0xfff) != 0x483} {error "Wrong target: read-only abort"}
for {set i 0} {$i < 180} {incr i} {
 echo "C $i [read_memory 0x20000e64 32 4]"
 sleep 2
}
poll
echo "STATE_END [stm32h7x.cpu0 curstate]"
shutdown
