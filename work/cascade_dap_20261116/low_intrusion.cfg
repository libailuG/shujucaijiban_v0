source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32h7x.cfg]
adapter speed 500
gdb port disabled
tcl port disabled
telnet port disabled
init
targets stm32h7x.cpu0
poll
if {[lindex [read_memory 0xe000ed00 32 1] 0] != 0x411fc272} {error "Wrong CPU"}
echo "STATE_BEGIN [stm32h7x.cpu0 curstate]"
for {set i 0} {$i <= 1} {incr i} {
 set t0 [lindex [read_memory 0x40000024 32 1] 0]
 set d [read_memory 0x20000ec8 32 19]
 set t1 [lindex [read_memory 0x40000024 32 1] 0]
 echo "SAMPLE $i $t0 $t1 $d"
 if {$i < 1} {sleep 10000}
}
echo "SNAP [read_memory 0x200015bc 32 61]"
echo "IMU [read_memory 0x20000f60 32 14]"
echo "MODE [read_memory 0x200011a0 32 4]"
echo "GPIOB [read_memory 0x58020410 32 2]"
echo "STATE_END [stm32h7x.cpu0 curstate]"
shutdown

