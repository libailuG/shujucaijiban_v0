source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32h7x.cfg]
adapter speed 500
gdb port disabled
tcl port disabled
telnet port disabled
init
targets stm32h7x.cpu0
poll
set cpuid [lindex [read_memory 0xe000ed00 32 1] 0]
set chipid [lindex [read_memory 0x5c001000 32 1] 0]
set uid [read_memory 0x1ff1e800 32 3]
echo "GUARD $cpuid $chipid $uid"
if {$cpuid != 0x411fc272 || ($chipid & 0xfff) != 0x483 || [lindex $uid 0] != 0x002b0018 || [lindex $uid 1] != 0x3035510e || [lindex $uid 2] != 0x34353932} {error "Wrong mainboard"}
echo "BEFORE_MODE [read_memory 0x200011ac 32 1]"
echo "BEFORE_VECTORS [read_memory 0x08000000 32 16]"
shutdown
