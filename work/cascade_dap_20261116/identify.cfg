source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32h7x.cfg]
adapter speed 1000
gdb port disabled
tcl port disabled
telnet port disabled
init
targets stm32h7x.cpu0
poll
set cpuid [lindex [read_memory 0xe000ed00 32 1] 0]
set chipid [lindex [read_memory 0x5c001000 32 1] 0]
echo "GUARD $cpuid $chipid"
if {$cpuid != 0x411fc272 || ($chipid & 0xfff) != 0x483} {error "Wrong target"}
echo "STATE [stm32h7x.cpu0 curstate]"
dump_image work/cascade_dap_20261116/flash.bin 0x08000000 0x41000
shutdown
