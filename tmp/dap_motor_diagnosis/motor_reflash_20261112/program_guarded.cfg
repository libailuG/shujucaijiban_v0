source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32g4x.cfg]
adapter speed 500
init
set cpuid [lindex [read_memory 0xe000ed00 32 1] 0]
set chipid [lindex [read_memory 0xe0042000 32 1] 0]
echo [format "GUARD CPUID=0x%08x CHIPID=0x%08x" $cpuid $chipid]
if {($cpuid & 0xfff0) != 0xc240 || ($chipid & 0xfff) != 0x468} { error "Refusing write: expected G431 motor only" }
reset halt
if {[catch {
 echo [flash write_image erase C:/Users/libai/Desktop/X1/dege_caiji/tmp/dap_motor_diagnosis/motor_reflash_20261112/motor_application.hex]
 echo [verify_image C:/Users/libai/Desktop/X1/dege_caiji/tmp/dap_motor_diagnosis/motor_reflash_20261112/motor_application.hex]
} message]} {
 echo "PROGRAMMING_FAILED: $message"
 shutdown error
} else {
 echo "APPLICATION_PROGRAM_AND_VERIFY_OK"
 reset run
 sleep 1000
 echo [mdw 0xe000ed08 1]
 echo [mdw 0x20000024 1]
 sleep 2000
 echo [mdw 0x20000024 1]
 echo [mdw 0x200007e4 12]
 shutdown
}
