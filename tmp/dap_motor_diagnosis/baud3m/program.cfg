init
set cpuid [lindex [read_memory 0xe000ed00 32 1] 0]
set chipid [lindex [read_memory 0xe0042000 32 1] 0]
echo [format "GUARD CPUID=0x%08x CHIPID=0x%08x" $cpuid $chipid]
if {($cpuid & 0xfff0) != 0xc240 || ($chipid & 0xfff) != 0x468} {error "Wrong chip; no writes allowed"}
echo [dump_image tmp/dap_motor_diagnosis/baud3m/boot_before.bin 0x08000000 0x8000]
echo [dump_image tmp/dap_motor_diagnosis/baud3m/params_before.bin 0x0801f800 0x800]
reset halt
if {[catch {
 echo [flash write_image erase tmp/dap_motor_diagnosis/baud3m/application.hex]
 echo [verify_image tmp/dap_motor_diagnosis/baud3m/application.hex]
} message]} {echo "PROGRAM_FAILED $message"; shutdown error} else {
 reset run
 sleep 1000
 echo [mdw 0x200003d4 13]
 sleep 2000
 echo [mdw 0x200003d4 13]
 echo [dump_image tmp/dap_motor_diagnosis/baud3m/boot_after.bin 0x08000000 0x8000]
 echo [dump_image tmp/dap_motor_diagnosis/baud3m/params_after.bin 0x0801f800 0x800]
 echo [mdw 0xe000ed08]
 shutdown
}
