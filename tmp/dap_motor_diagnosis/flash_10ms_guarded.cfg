source [find interface/cmsis-dap.cfg]
adapter serial "ATK 20190528"
transport select swd
source [find target/stm32h7x.cfg]
adapter speed 500
init
targets stm32h7x.cpu0
set cpuid [lindex [read_memory 0xe000ed00 32 1] 0]
set chipid [lindex [read_memory 0x5c001000 32 1] 0]
echo [format "GUARD CPUID=0x%08x DBGMCU_IDCODE=0x%08x" $cpuid $chipid]
if {($cpuid & 0xfff0) != 0xc270 || ($chipid & 0xfff) != 0x483} { error "Refusing write: not expected H723 mainboard" }
reset halt
flash write_image erase C:/Users/libai/Desktop/X1/imu_caiji/zhuban_caiji/Objects/zhuban_led.hex
verify_image C:/Users/libai/Desktop/X1/imu_caiji/zhuban_caiji/Objects/zhuban_led.hex
reset run
sleep 1000
mdw 0x200006b0 11
mdw 0x58021814 1
sleep 5000
mdw 0x200006b0 11
mdw 0x58021814 1
mdw 0x200005e0 14
shutdown
