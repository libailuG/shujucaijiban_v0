source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32h7x.cfg]
adapter speed 500
gdb port disabled
tcl port disabled
telnet port disabled
init
targets stm32h7x.cpu0
poll
echo "RIGHT_UART [read_memory 0x40011000 32 12]"
echo "RIGHT_DMA [read_memory 0x40020070 32 6]"
echo "DMAMUX [read_memory 0x40020810 32 1]"
echo "GPIOA [read_memory 0x58020000 32 10]"
echo "CLOCK [read_memory 0x58024454 32 1]"
echo "DIAGS [read_memory 0x20000ed4 32 38]"
shutdown
