source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32h7x.cfg]
adapter speed 500
init
targets stm32h7x.cpu0
set cpuid [lindex [read_memory 0xe000ed00 32 1] 0]
set chipid [lindex [read_memory 0x5c001000 32 1] 0]
echo [format "GUARD CPUID=0x%08x CHIPID=0x%08x" $cpuid $chipid]
if {($cpuid & 0xfff0) != 0xc270 || ($chipid & 0xfff) != 0x483} {error "Wrong target"}
reset halt
if {[catch {
 echo [flash write_image erase C:/Users/libai/Desktop/X1/imu_caiji/zhuban_caiji/Objects/zhuban_led.hex]
 echo [verify_image C:/Users/libai/Desktop/X1/imu_caiji/zhuban_caiji/Objects/zhuban_led.hex]
} message]} {echo "PROGRAM_FAILED $message";shutdown error} else {
 reset run
 sleep 1000
 echo [mdw 0x20000674 35]
 echo [mdw 0x2000078c 35]
 echo [mdw 0x2000062c 4]
 echo [mdw 0x20000818 6]
 echo [mdw 0x20000884 12]
 sleep 3000
 echo [mdw 0x200006d4 11]
 echo [mdw 0x200007ec 11]
 echo [mdw 0x200005f4 14]
 echo [mdw 0x20000818 6]
 shutdown
}
