# Explicit one-time setup for STM32H723 maximum CPU frequency.
# Run only after recovering normal debug access. Preserve all other options.
source [find interface/stlink.cfg]
transport select swd
source [find target/stm32h7x.cfg]
adapter speed 100
gdb port disabled
tcl port disabled
telnet port disabled
init
halt
set cur [lindex [stm32h7x.cpu0 read_memory 0x5200201C 32 1] 0]
set prg [lindex [stm32h7x.cpu0 read_memory 0x52002020 32 1] 0]
set cur2 [lindex [stm32h7x.cpu0 read_memory 0x52002070 32 1] 0]
set prg2 [lindex [stm32h7x.cpu0 read_memory 0x52002074 32 1] 0]
if {$cur != $prg || $cur2 != $prg2} { error "Pending option changes; refusing to commit" }
if {(($cur >> 8) & 255) != 170} { error "Unexpected RDP; refusing option changes" }
if {($cur2 & 4) == 0} {
    stm32h7x.cpu0 write_memory 0x52002008 32 {0x08192A3B}
    stm32h7x.cpu0 write_memory 0x52002008 32 {0x4C5D6E7F}
    set control [lindex [stm32h7x.cpu0 read_memory 0x52002018 32 1] 0]
    if {($control & 1) != 0} { error "Option registers remained locked" }
    stm32h7x.cpu0 write_memory 0x52002074 32 [list [expr {$cur2 | 4}]]
    stm32h7x.cpu0 write_memory 0x52002018 32 [list [expr {$control | 2}]]
    for {set i 0} {$i < 40} {incr i} {
        set status [lindex [stm32h7x.cpu0 read_memory 0x5200201C 32 1] 0]
        if {($status & 1) == 0} { break }
        sleep 50
    }
    stm32h7x.cpu0 write_memory 0x52002018 32 {1}
    if {($status & 0x40000001) != 0} { error "Option programming busy/error" }
}
echo CPUFREQ_BOOST_CURRENT
echo [stm32h7x.cpu0 read_memory 0x52002070 32 2]
reset run
shutdown
