source [find interface/cmsis-dap.cfg]
adapter serial "ATK 20190528"
transport select swd
source [find target/stm32h7x.cfg]
adapter speed 500
init
targets stm32h7x.cpu0
set cpuid [lindex [read_memory 0xe000ed00 32 1] 0]
set chipid [lindex [read_memory 0x5c001000 32 1] 0]
if {($cpuid & 0xfff0) != 0xc270 || ($chipid & 0xfff) != 0x483} { error "Not H723 mainboard" }
echo "H723_MAINBOARD_CONFIRMED"
reset halt
flash write_image erase C:/Users/libai/Desktop/X1/imu_caiji/zhuban_caiji/ObjectsCli/zhuban_led.hex
verify_image C:/Users/libai/Desktop/X1/imu_caiji/zhuban_caiji/ObjectsCli/zhuban_led.hex
echo "FLASH_VERIFY_OK"
reset run
sleep 2000
echo [format "HEALTH_A=%u GPIOG_ODR=0x%x UART1_TX=%u" [lindex [read_memory 0x200010a0 32 1] 0] [lindex [read_memory 0x58021814 32 1] 0] [lindex [read_memory 0x200010a4 32 1] 0]]
sleep 3000
echo [format "HEALTH_B=%u GPIOG_ODR=0x%x UART1_TX=%u" [lindex [read_memory 0x200010a0 32 1] 0] [lindex [read_memory 0x58021814 32 1] 0] [lindex [read_memory 0x200010a4 32 1] 0]]
shutdown
