source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32h7x.cfg]
adapter speed 100
gdb port disabled
tcl port disabled
telnet port disabled
init
targets stm32h7x.cpu0
poll
echo "STATE [stm32h7x.cpu0 curstate]"
echo "VECTORS [read_memory 0x08000000 32 16]"
echo "CODE [read_memory 0x08007000 32 16]"
echo "DIAG [read_memory 0x20000ec8 32 19]"
echo "SNAP [read_memory 0x200015bc 32 61]"
echo "UART5 [read_memory 0x40005000 32 11]"
echo "DMA3 [read_memory 0x40020058 32 6]"
echo "TIME [read_memory 0x40000024 32 1]"
shutdown
