source [find interface/cmsis-dap.cfg]
adapter serial "ATK 20190528"
transport select swd
source [find target/stm32h7x.cfg]
adapter speed 500
init
targets stm32h7x.cpu0
reset halt
verify_image C:/Users/libai/Desktop/X1/imu_caiji/zhuban_caiji/ObjectsCli/zhuban_led.hex
echo "VERIFY_IMAGE_OK"
reset run
sleep 2000
echo [format "UART1_TX_A=%u CR1=0x%x BRR=%u" [lindex [read_memory 0x200010a0 32 1] 0] [lindex [read_memory 0x40004c00 32 1] 0] [lindex [read_memory 0x40004c0c 32 1] 0]]
sleep 3000
echo [format "UART1_TX_B=%u UART2_TX=%u" [lindex [read_memory 0x200010a0 32 1] 0] [lindex [read_memory 0x200010f8 32 1] 0]]
shutdown
