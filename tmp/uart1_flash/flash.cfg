source [find interface/cmsis-dap.cfg]
adapter serial "ATK 20190528"
transport select swd
source [find target/stm32h7x.cfg]
adapter speed 500
init
targets stm32h7x.cpu0
set cpuid [lindex [read_memory 0xe000ed00 32 1] 0]
set chipid [lindex [read_memory 0x5c001000 32 1] 0]
echo [format "GUARD CPUID=0x%08x DBGMCU=0x%08x" $cpuid $chipid]
if {($cpuid & 0xfff0) != 0xc270 || ($chipid & 0xfff) != 0x483} { error "Not H723 mainboard, abort" }
reset halt
flash write_image erase C:/Users/libai/Desktop/X1/imu_caiji/zhuban_caiji/ObjectsCli/zhuban_led.hex
verify_image C:/Users/libai/Desktop/X1/imu_caiji/zhuban_caiji/ObjectsCli/zhuban_led.hex
reset run
sleep 2000
mdw 0x200010a0 1
mdw 0x40004c00 4
sleep 3000
mdw 0x200010a0 1
mdw 0x200010f8 1
shutdown
