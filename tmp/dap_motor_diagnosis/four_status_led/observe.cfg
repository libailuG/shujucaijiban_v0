source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32h7x.cfg]
adapter speed 500
init
targets stm32h7x.cpu0
echo [mdw 0x200006c0 11]
for {set i 0} {$i < 70} {incr i} {
 echo "LED $i [read_memory 0x2000061c 32 3]"
 sleep 100
}
echo [mdw 0x200006c0 11]
echo [mdw 0x200005e4 14]
shutdown
