source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32h7x.cfg]
adapter speed 500
gdb port disabled
tcl port disabled
telnet port disabled
init
targets stm32h7x.cpu0
set lowA 0
set lowB 0
for {set i 0} {$i < 500} {incr i} {
 set a [lindex [read_memory 0x58020010 32 1] 0]
 set b [lindex [read_memory 0x58020410 32 1] 0]
 if {($a & 0x400)==0} {incr lowA}
 if {($b & 0x1000)==0} {incr lowB}
}
echo "RX_PIN_LOW A10=$lowA B12=$lowB samples=500"
echo "UART1 [read_memory 0x40011000 32 12]"
echo "GPIOA [read_memory 0x58020000 32 10]"
echo "DMA4 [read_memory 0x40020070 32 6]"
shutdown
